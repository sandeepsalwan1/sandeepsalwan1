name: Update activity graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02 # v1.0.0
        with:
          username: ${{ github.repository_owner }}
          options: theme=react-dark&bg_color=20232a&hide_border=true&area=true&custom_title=GitHub%20Activity%20Graph%20(Last%2030%20Days)
          output_path: output/activity-graph.svg

      - name: Publish to output branch
        working-directory: output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git add activity-graph.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Update activity graph"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
